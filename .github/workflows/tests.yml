name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test portable bridge
        run: python -m unittest tests.test_bridge tests.test_passthrough tests.test_antigravity
      - name: Test macOS integrations
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests
